<script>

var piece = [11];
var gridUnit;

function boardInit () {
  piece[0] = new Piece($('#longVert1'), 0, 0x88, 0, 0);
  piece[1] = new Piece($('#longVert2'), 1, 0x88, 3, 0);
  piece[2] = new Piece($('#longVert3'), 2, 0x88, 0, 3);
  piece[3] = new Piece($('#longVert4'), 3, 0x88, 3, 3);
  piece[4] = new Piece($('#longHoriz'), 4, 0xc0, 1, 2);
  piece[5] = new Piece($('#square1'), 5, 0x80, 1, 3);
  piece[6] = new Piece($('#square2'), 6, 0x80, 2, 3);
  piece[7] = new Piece($('#square3'), 7, 0x80, 1, 4);
  piece[8] = new Piece($('#square4'), 8, 0x80, 2, 4);
  piece[9] = new Piece($('#sun'), 9, 0xcc, 1, 0);
}

function pieceShift (piece, bitsRight) {
  piece.location >>= bitsRight;
}

function boardGet (piece) {
  var board = 0;
  for (var i = 0; i < 10; i++)
    board |= piece[i].location;
  return board;
}

function Piece (img, n, shape, x, y) {
  this.setPosition = function() {
    this.location = this.shape << (4 * 4);
    for (var i = 0; i < this.x; i++)
      pieceShift(this, 1);
    for (var i = 0; i < this.y; i++)
      pieceShift(this, 4);
  }

  this.imgObj = img;
  this.shape = shape;
  this.id = n;
  this.x = x;
  this.y = y;
  this.setPosition();
  $(this.imgObj).css({left: x * gridUnit, top: y * gridUnit});
  $.data(img[0], 'myObj', this);
}

function assessBoard () {
  for (var i = 0; i < 10; i++)
    piece[i].setPosition();
  var board = boardGet(piece);
  for (var i = 0; i < 10; i++) {
    var boardWithoutPiece = (board & ~piece[i].location) | 0xf00000f;
    piece[i].nLeft = 0;
    while (((piece[i].location & 0x888880) == 0) && (((piece[i].location << (piece[i].nLeft+1)) & boardWithoutPiece) == 0))  // can move left
      piece[i].nLeft++;
    piece[i].nRight = 0;
    while (((piece[i].location & 0x111110) == 0) && (((piece[i].location >> (piece[i].nRight+1)) & boardWithoutPiece) == 0))  // can move right
      piece[i].nRight++;
    piece[i].nUp = 0;
    while (((piece[i].location & 0xf00000) == 0) && (((piece[i].location << ((piece[i].nUp+1)*4)) & boardWithoutPiece) == 0))  // can move up
      piece[i].nUp++;
    piece[i].nDown = 0;
    while (((piece[i].location & 0x0000f0) == 0) && (((piece[i].location >> ((piece[i].nDown+1)*4)) & boardWithoutPiece) == 0))  // can down
      piece[i].nDown++;
    if ((piece[i].nLeft > 0) || (piece[i].nRight > 0) || (piece[i].nUp > 0) || (piece[i].nDown > 0)) {
      piece[i].freedom = 0;
      if ((piece[i].nLeft > 0) || (piece[i].nRight > 0))
        piece[i].freedom |= 1;
      if ((piece[i].nUp > 0) || (piece[i].nDown > 0))
        piece[i].freedom |= 2;
    }
  }
  for (var i = 0; i < 10; i++) {
    $(piece[i].imgObj).attr('draggable', false);
    if ((piece[i].nLeft > 0) || (piece[i].nRight > 0) || (piece[i].nUp > 0) || (piece[i].nDown > 0)) {
      $(piece[i].imgObj).draggable({
        drag: function(event, ui) {
          var obj = $.data(this, 'myObj');
          var newx = obj.x;
          var newy = obj.y;
          if ((obj.freedom == 2) ||
              ((obj.freedom == 3) && (Math.abs(ui.position.top - ui.originalPosition.top) > Math.abs(ui.position.left - ui.originalPosition.left)))) {
            ui.position.top = Math.min(Math.max(gridUnit * (obj.y - obj.nUp), ui.position.top), gridUnit * (obj.y + obj.nDown));
            ui.position.left = ui.originalPosition.left;
            newy = Math.floor((ui.position.top + gridUnit / 2) / gridUnit);
          } else {
            ui.position.top = ui.originalPosition.top;
            ui.position.left = Math.min(Math.max(gridUnit * (obj.x - obj.nLeft), ui.position.left), gridUnit * (obj.x + obj.nRight));
            newx = Math.floor((ui.position.left + gridUnit / 2) / gridUnit);
          }
          if ((newx != obj.x) || (newy != obj.y)) {
            obj.x = newx;
            obj.y = newy;
            $(this).css({left: obj.x * gridUnit, top: obj.y * gridUnit});
            ui.originalPosition.left = obj.x * gridUnit;
            ui.originalPosition.top = obj.y * gridUnit;
            assessBoard();
          }
        }, stop: function(event, ui) {
          var obj = $.data(this, 'myObj');
          if ((obj.freedom == 2) ||
              ((obj.freedom == 3) && (Math.abs(ui.position.top - ui.originalPosition.top) > Math.abs(ui.position.left - ui.originalPosition.left))))
            obj.y = Math.floor((ui.position.top + gridUnit / 2) / gridUnit);
          else
            obj.x = Math.floor((ui.position.left + gridUnit / 2) / gridUnit);
          $(this).css({left: obj.x * gridUnit, top: obj.y * gridUnit});
          assessBoard();
        }
      });
    }
  }
  if ((piece[9].x == 1) && (piece[9].y == 3))
    $('#congrats').show();
  else
    $('#congrats').hide();
}

$(window).on('load', function() {  // wait until images are loaded

gridUnit = $('#square1').height();
var boardWidth = gridUnit * 4;
var boardHeight = gridUnit * 5;
$('#board').width(boardWidth).height(boardHeight);
$('#reset').click(function() {
  boardInit();
  assessBoard();
});

boardInit();
assessBoard();

});
</script>
